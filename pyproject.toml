[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deribit-gex-terminal"
version = "0.1.0"
description = "Phase 1 raw Deribit BTC options ingestion"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1.0",
  "fastapi>=0.111,<1.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "project"]
testpaths = ["project/tests"]
