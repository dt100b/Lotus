<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lotus Terminal</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #101317;
        color: #edf1f7;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, calc(100vw - 48px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.1;
        letter-spacing: 0;
      }

      p {
        margin: 0 0 20px;
        color: #aeb9c8;
        line-height: 1.6;
      }

      a {
        color: #75d0ff;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Lotus frontend is mock-data first.</h1>
      <p>
        The production frontend should stay disconnected from live backend data until
        the mock-data implementation is visually approved. The previous dashboard is
        archived at <a href="/legacy-dashboard">/legacy-dashboard</a> for backend
        validation and comparison.
      </p>
    </main>
  </body>
</html>
